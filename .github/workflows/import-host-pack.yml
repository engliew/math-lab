name: Import host pack parts

on:
  push:
    branches:
      - cursor/host-pack-610ecdc-2932
    paths:
      - .github/workflows/import-host-pack.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: github.ref == 'refs/heads/cursor/host-pack-610ecdc-2932'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/host-pack-610ecdc-2932
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download and place 49 part files
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/parts.tgz https://litter.catbox.moe/s1xdw2.tgz
          mkdir -p /tmp/parts-in host
          tar -xzf /tmp/parts.tgz -C /tmp/parts-in
          # only the 49 original parts
          count=0
          for i in $(seq -f '%02g' 0 48); do
            src="/tmp/parts-in/part_${i}.b64"
            test -f "$src"
            cp -f "$src" "host/part_${i}.b64"
            count=$((count+1))
          done
          test "$count" -eq 49
          test "$(wc -c < host/part_00.b64)" -eq 666668
          test "$(wc -c < host/part_48.b64)" -eq 142104
          cat host/part_*.b64 | base64 -d | sha256sum | grep -q d01a373fb052f9ecd17eca052036c023cf8e89c199c3911bfffa21a09b50ecac
          rm -f host/_probe.b64
          ls -l host/part_*.b64 | wc -l
      - name: Commit parts
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add host/part_00.b64 host/part_01.b64 host/part_02.b64 host/part_03.b64 host/part_04.b64 host/part_05.b64 host/part_06.b64 host/part_07.b64 host/part_08.b64 host/part_09.b64
          git add host/part_1*.b64 host/part_2*.b64 host/part_3*.b64 host/part_4*.b64
          git add -u host/_probe.b64 || true
          git status --short
          git commit -m "Add host/part_00.b64 through host/part_48.b64 for SHA 610ecdc host pack"
          git push origin HEAD:cursor/host-pack-610ecdc-2932
