# Static vhost for Math Lab on the engliew.xyz lab box (nginx).
# Site is a Next.js static export — no Node process, no env vars.
#
# Install (Scott):
#   sudo mkdir -p /opt/mathlab.engliew.xyz
#   sudo tar -xzf mathlab.engliew.xyz.tar.gz -C /opt --strip-components=0
#     # archive top folder is mathlab.engliew.xyz/
#   sudo cp deploy/nginx-mathlab.engliew.xyz.conf /etc/nginx/conf.d/mathlab.engliew.xyz.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# DNS: A record mathlab → same Elastic IP as the other *.engliew.xyz labs.
# Then certbot -d mathlab.engliew.xyz (same pattern as meridian / srshoot).

server {
    listen 80;
    listen [::]:80;
    server_name mathlab.engliew.xyz;

    root /opt/mathlab.engliew.xyz;
    index index.html;

    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ $uri.html /404.html;
    }
}
