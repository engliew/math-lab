# Math Lab on the engliew.xyz lab box (nginx → Node).
# App lives at /opt/mathlab and listens on 127.0.0.1:47821.
#
# Scott:
#   sudo cp deploy/nginx-mathlab.engliew.xyz.conf /etc/nginx/conf.d/mathlab.engliew.xyz.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# This replaces the old static-file vhost (root /opt/mathlab.engliew.xyz).
# DNS: A record mathlab → same Elastic IP as the other *.engliew.xyz labs.
# HTTPS: certbot --nginx -d mathlab.engliew.xyz (same pattern as meridian / srshoot).

server {
    listen 80;
    listen [::]:80;
    server_name mathlab.engliew.xyz;

    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:47821;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
